# Sample override values for 3-nodes cluster with SR-IOV configured on DP node.

# etcd
clusterSize: 3
etcdNodePort: 32379

nodeSelectors:
  enabled: true

# cassandra for HSSDB
cassandra:
  config:
    cluster_size: 3

# omec
networks:
  etcdurl: http://node1:32379
config:
  sriov:
    resourceList:
    - resourceName: sriov_vfio
      selectors:
        pfNames:
          - enp1s0f0
        drivers:
          - vfio-pci
