apiVersion: cluster.x-k8s.io/v1alpha3
kind: Cluster
metadata:
  name: comac
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha3
    kind: GCPCluster
    name: comac
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha3
kind: GCPCluster
metadata:
  name: comac
  namespace: default
spec:
  network:
    name: default
  project: ${GCP_PROJECT}
  region: ${GCP_REGION}
