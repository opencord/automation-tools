# Values for deploying comac-in-a-box
spgwu:
  conf:
    dp:
      devices: "--no-pci --vdev eth_af_packet0,iface=s1u-net --vdev eth_af_packet1,iface=sgi-net"
network:
  sriov:
    enabled: false
  networks:
    - name: s1u-net
      type: ptp
      ipam: host-local
      subnet: 119.0.0.0/24
      gateway: 119.0.0.254
    - name: sgi-net
      type: ptp
      ipam: host-local
      subnet: 13.1.1.0/24
      gateway: 13.1.1.254
